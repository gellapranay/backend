# Production PostgreSQL Configuration on Render
# Fallbacks mirror application.properties so a missing env var degrades to a
# connection error rather than an unresolvable-placeholder crash at startup.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-db4em6vlk1mc73fps0ug-a.singapore-postgres.render.com:5432/tt_wbyu?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tt_wbyu_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
