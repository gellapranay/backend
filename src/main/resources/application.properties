server.port=${PORT:8080}

# Spring Application
spring.application.name=antarmarg-backend

# Datasource configuration - PostgreSQL (Render Cloud Database)
# Connects to Render Postgres instance with SSL enabled
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-db4em6vlk1mc73fps0ug-a.oregon-postgres.render.com:5432/tt_wbyu?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tt_wbyu_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway configuration (disabled for automatic JPA update schema sync, can be enabled on prod)
spring.flyway.enabled=false

# JWT Configuration
# Must be at least 32 characters (HS256 requirement). Override via JWT_SECRET on Render.
antarmarg.jwt.secret=${JWT_SECRET:antarmarg-local-dev-secret-key-change-me-0123456789}
antarmarg.jwt.expiration-ms=86400000

# Super Admin Bootstrap credentials
antarmarg.admin.email=${SUPER_ADMIN_EMAIL:superadmin@antarmarg.com}
antarmarg.admin.name=Antarmarg System Administrator

# Health check endpoint for Render
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.antarmarg=INFO
logging.level.org.springframework.security=WARN
